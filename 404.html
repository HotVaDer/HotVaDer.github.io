<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrong turn</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Mono&family=Inter:ital,wght@1,800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: #0b0b0c; color: #ecebe6; font-family: 'Inter', system-ui, sans-serif; text-align: center; }
    p { margin: 0; }
    .code { font-family: 'DM Mono', monospace; letter-spacing: .4em; color: #8b8a85; }
    h1 { margin: .2em 0; font-style: italic; font-weight: 800; font-size: clamp(3rem, 12vw, 7rem); letter-spacing: -.04em; line-height: 1; }
    h1 span { color: #ff5a1f; }
    .hand { font-family: 'Caveat', cursive; font-size: 1.6rem; color: #8b8a85; }
    a { display: inline-block; margin-top: 2rem; font-family: 'Caveat', cursive; font-size: 1.6rem; color: #ff5a1f; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>wrong turn<span>.</span></h1>
    <p class="hand">this page went off track somewhere around Flugplatz.</p>
    <a href="/">back to the pit lane →</a>
  </main>
</body>
</html>
